<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>자문패스 — 투자권유자문인력 합격 학습</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#191f28;--sub:#6b7684;--sub2:#8b95a1;--line:#e8ebee;--pri:#2f5bff;--pri2:#2448e0;--pri-soft:#eaf0ff;--ok:#10a35a;--ok-soft:#e5f6ec;--warn:#e08600;--warn-soft:#fff3e0;--bad:#e5484d;--bad-soft:#fdecec;--vio:#8b5cf6;--vio-soft:#f1ebff;--chip:#f1f3f6;--shadow:0 2px 10px rgba(25,31,40,.05);--fs:16px}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1318;--card:#191e25;--txt:#eef1f5;--sub:#98a2ae;--sub2:#7d8794;--line:#262d36;--pri:#5b7cff;--pri2:#4a6bf0;--pri-soft:#1f2a4a;--ok:#2fbf71;--ok-soft:#173226;--warn:#f0a32a;--warn-soft:#3a2b14;--bad:#f06b70;--bad-soft:#3b1d20;--vio:#a78bfa;--vio-soft:#2a2342;--chip:#232a33;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:var(--fs)/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 8px) 18px calc(env(safe-area-inset-bottom) + 96px)}
#app.full{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
.ic{width:1.25em;height:1.25em;vertical-align:-.25em;flex:0 0 auto}
h1.pg{font-size:20px;text-align:center;margin:14px 0 2px;font-weight:800}
.pgsub{text-align:center;color:var(--sub);font-size:14px;margin-bottom:18px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin:4px 0 8px}
.top .tt{flex:1;text-align:center;font-weight:800;font-size:17px;line-height:1.35}
.top .tt small{display:block;color:var(--sub);font-weight:600;font-size:12.5px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.iconbtn:active{background:var(--chip)}
.card{background:var(--card);border-radius:22px;padding:20px;margin:12px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--sub)}.sm{font-size:13.5px}.xs{font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .4s}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:16px;font-weight:800;font-size:17px;background:var(--pri);color:#fff}
.btn:active{transform:scale(.99);background:var(--pri2)}
.btn.white{background:#fff;color:var(--pri)}.btn.ghost{background:var(--chip);color:var(--txt)}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{height:44px;font-size:15px;border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:13.5px;font-weight:700}
/* 홈 */
.hello{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 4px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:-.03em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4f7bff,#2448e0);display:grid;place-items:center;color:#fff}

.exsw button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dday .k{color:var(--sub);font-weight:700;font-size:15px}

.rec{background:var(--pri);color:#fff;border-radius:26px;padding:22px 20px;margin:14px 0}

.why{background:var(--card);color:var(--txt);border-radius:18px;padding:16px 18px;margin-bottom:14px}

.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.sec-h{font-size:21px;font-weight:900;margin:26px 2px 12px;letter-spacing:-.03em}

.badge{position:absolute;top:-4px;right:6px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px}

.cont{background:var(--pri);color:#fff;border-radius:24px;padding:20px}
.cont .between{font-weight:700;font-size:13.5px;opacity:.9}

.num{width:48px;height:48px;border-radius:14px;background:var(--pri-soft);color:var(--pri);font-weight:900;font-size:18px;display:grid;place-items:center;flex:0 0 auto}
.subj .m{flex:1;min-width:0}.subj .m b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subj .p{width:90px;text-align:right;font-size:13px;color:var(--sub);font-weight:600}

.unit{background:var(--card);border-radius:20px;margin:10px 0;box-shadow:var(--shadow);overflow:hidden}
.unit>button{display:flex;align-items:center;gap:14px;padding:18px;width:100%;text-align:left}
.unit .les{border-top:1px solid var(--line);margin-left:22px;border-left:3px solid var(--pri-soft)}
.les button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
.les button:last-child{border-bottom:0}
.les .n{width:38px;height:38px;border-radius:11px;background:var(--chip);color:var(--pri);font-weight:800;display:grid;place-items:center;flex:0 0 auto}
.les .n.done{background:var(--ok-soft);color:var(--ok)}.les .n.cur{background:var(--pri);color:#fff}
.les b{display:block;font-size:15px;font-weight:700;line-height:1.4}.les small{color:var(--sub);font-size:12.5px}.les small.cur{color:var(--pri);font-weight:700}
/* 레슨 */
.steps{display:flex;align-items:center;padding:14px 8px 18px;border-bottom:1px solid var(--line);margin:0 -18px 16px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sub);width:56px}
.step i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;background:var(--card);color:var(--sub)}
.step.on{color:var(--pri)}.step.on i{border-color:var(--pri);color:var(--pri);box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 11px var(--pri)}
.step.done i{background:var(--pri);border-color:var(--pri);color:#fff}
.step-l{flex:1;height:3px;background:var(--line);margin-bottom:22px;border-radius:3px}.step-l.on{background:var(--pri)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;font-weight:800;font-size:14px}
.big-q{font-size:22px;font-weight:900;text-align:center;line-height:1.45;margin:14px 0 18px;letter-spacing:-.03em}
.qcard{border:1.5px solid var(--line);border-radius:22px;padding:18px;background:var(--card)}
.qtext{font-size:17.5px;font-weight:800;line-height:1.55;margin:2px 2px 16px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:var(--card);font-weight:600;font-size:15.5px;line-height:1.45}
.opt .k{width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-weight:800;color:var(--sub);flex:0 0 auto;font-size:14px}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}.opt.sel .k{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}.opt.no .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:14px 16px;margin-top:12px;font-size:15px;line-height:1.6}
.fb b{display:block;margin-bottom:2px;font-size:15.5px}
.fb.ok{background:var(--ok-soft)}.fb.ok b{color:var(--ok)}.fb.no{background:var(--bad-soft)}.fb.no b{color:var(--bad)}
.skip{display:block;margin:16px auto 0;color:var(--sub);text-decoration:underline;font-size:14.5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;margin:0 -18px 6px;padding-left:18px;padding-right:18px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1.5px solid var(--line);border-radius:99px;padding:9px 16px;font-weight:700;font-size:14.5px;background:var(--card)}
.chips button.on{border-color:var(--pri);color:var(--pri)}
.lh{font-size:24px;font-weight:900;line-height:1.4;margin:16px 0 8px;letter-spacing:-.03em}
.lead{color:var(--sub);font-size:16px;line-height:1.65;margin-bottom:18px}
.sect h4{color:var(--pri);font-size:17px;margin:26px 0 10px;font-weight:800}
.sect p{font-size:16.5px;line-height:1.85;margin:0 0 14px}
.sect ul{padding-left:20px;margin:0}.sect li{font-size:16px;line-height:1.75;margin:8px 0}.sect li::marker{color:var(--pri)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 14px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tbl th,.tbl td{border:1px solid var(--line);padding:10px;text-align:left;vertical-align:top;line-height:1.5}
.tbl tr:first-child td{background:var(--chip);font-weight:800;color:var(--sub)}
.tbl td:first-child{font-weight:800;background:var(--chip)}
.ex{background:var(--chip);border-radius:16px;padding:14px 16px;font-size:15.5px;line-height:1.75}
/* 하단 고정 */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);z-index:20}
.dock .in{max-width:524px;margin:0 auto;display:flex;gap:10px}
.dock .back{width:72px;height:56px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:0 0 auto}
nav.tab{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tab::after{content:"";position:absolute;left:0;right:0;top:100%;height:120px;background:var(--card)}
nav.tab .in{max-width:560px;margin:0 auto;display:flex}
nav.tab button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:12.5px;font-weight:600;color:var(--sub2)}
nav.tab button svg{width:27px;height:27px}
nav.tab button.on{color:var(--pri);font-weight:800}
/* 문제 탭 */
.menu{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:22px;padding:20px;margin:12px 0;box-shadow:var(--shadow);width:100%;text-align:left;border:1.5px solid transparent}
.menu .t{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:0 0 auto}
.menu .t svg{width:28px;height:28px}
.menu b{display:block;font-size:18px;font-weight:800}.menu small{color:var(--sub);font-size:14px}
.menu .chev{margin-left:auto;color:var(--sub)}
.hr{height:1px;background:var(--line);margin:22px 0 16px}
.lbl{color:var(--sub);font-size:14px;font-weight:600;margin:20px 4px 8px}
/* 문제 풀이 */
.qhead{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.qhead .bar{flex:1}
.qmeta{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qmeta span{background:var(--chip);color:var(--sub);font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:8px}
.timer{font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
/* 분석 */
.seg{display:flex;background:var(--card);border-radius:16px;padding:5px;box-shadow:var(--shadow)}
.seg button{flex:1;height:46px;border-radius:12px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--pri);color:#fff}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:16px 0 4px;font-size:13.5px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.hm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.hm button{border:1.5px solid var(--line);border-radius:16px;padding:14px 8px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;background:var(--card)}
.hm b{font-size:21px;font-weight:900}.hm small{font-size:13px;font-weight:600;line-height:1.3}
.c-ok{background:var(--ok-soft)!important;border-color:color-mix(in srgb,var(--ok) 35%,transparent)!important;color:var(--ok)}
.c-warn{background:var(--warn-soft)!important;border-color:color-mix(in srgb,var(--warn) 35%,transparent)!important;color:var(--warn)}
.c-bad{background:var(--bad-soft)!important;border-color:color-mix(in srgb,var(--bad) 35%,transparent)!important;color:var(--bad)}
.c-none{color:var(--sub)}
/* 설정 */
.set{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.set>*{display:flex;align-items:center;gap:14px;padding:17px 18px;width:100%;text-align:left;border-bottom:1px solid var(--line);font-size:16px}
.set>*:last-child{border-bottom:0}
.set .v{margin-left:auto;color:var(--sub);font-size:15px;display:flex;align-items:center;gap:4px}
.set svg.ic{color:var(--pri)}
.set select,.set input[type=date]{margin-left:auto;font:inherit;color:var(--sub);background:none;border:0;text-align:right;font-size:15px}
.prem{background:linear-gradient(135deg,#4f7bff,#2448e0);color:#fff;border-radius:24px;padding:22px;text-align:center;margin:8px 0 6px}
.prem h3{margin:0 0 4px;font-size:21px;font-weight:900}.prem p{margin:0;opacity:.85;font-size:14px}
.foot{color:var(--sub2);font-size:13px;text-align:center;line-height:1.7;margin:22px 0 4px}
.disc{border:1.5px solid var(--line);border-radius:18px;padding:16px;color:var(--sub);font-size:14px;line-height:1.65;margin-top:14px}
.disc a{color:var(--pri)}
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;background:var(--card);color:var(--txt)}
/* 모달 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .box{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 18px);max-height:86dvh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:#191f28;color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:600;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.res-big{text-align:center;margin:16px 0}
.res-big .s{font-size:56px;font-weight:900;color:var(--pri);letter-spacing:-.04em}
.res-big .pass{display:inline-block;margin-top:6px;padding:7px 14px;border-radius:99px;font-weight:800}
.mk{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:18px;margin:10px 0;box-shadow:var(--shadow);border:1.5px solid transparent}
.mk.next{border-color:var(--pri)}
.mk b{font-size:19px;font-weight:900}
.small-btn{background:var(--pri);color:#fff;font-weight:800;border-radius:99px;padding:11px 20px;margin-left:auto;font-size:15px}
.chk{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-size:15.5px}
.chk i{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.chk.on i{background:var(--pri);border-color:var(--pri);color:#fff}
.chk.on span{color:var(--sub);text-decoration:line-through}
.empty{text-align:center;color:var(--sub);padding:30px 10px;font-size:15px}
.backhome{display:inline-block;padding:6px 2px 8px;color:var(--sub);font-weight:700;font-size:14px;text-decoration:none}
</style>
</head>

<div id="app"></div>
<nav class="tab" id="tab"></nav>

<script src="data-sec.js"></script>

<script src="data-sec-more.js"></script>

<script>
"use strict";
/* ───────────────── 기본 ───────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const DAY = 86400000;
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* 아이콘 (선 아이콘, 글자색을 따라감) */
const IP = {

/* 보기 순서를 문항마다 고정된 방식으로 섞기 (정답 위치가 한쪽에 몰리지 않게) */
(() => {
  const seed = str => { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; };
  const mix = (o, a, key) => { const r = seed(key), idx = o.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return {o: idx.map(i => o[i]), a: idx.indexOf(a)}; };
  Object.values(window.JP_DATA).forEach(d => {
    d.questions.forEach(q => { const m = mix(q.o, q.a, q.id); q.o = m.o; q.a = m.a; });
    d.lessons.forEach(l => { const m = mix(l.guess.o, l.guess.a, l.id); l.guess.o = m.o; l.guess.a = m.a; });
  });
})();

/* ───────────────── 저장 (이 기기 브라우저에만) ───────────────── */
const KEY = "jamunpass-v1";
const DEF = {exam: null, dates: {fund: "", sec: ""}, theme: "system", font: "m", cap: 50, prog: {}, checks: {}, seenIntro: false};
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { S = Object.assign({}, DEF); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const P = () => (S.prog[S.exam] = S.prog[S.exam] || {ans: {}, les: {}, mark: {}, days: {}, mocks: [], last: null});

/* ───────────────── 데이터 도우미 ───────────────── */
const D = () => window.JP_DATA[S.exam];
const units = () => D().subjects.flatMap(s => s.units.map(u => ({...u, sid: s.id, sname: s.name})));
const unitOf = id => units().find(u => u.id === id);
const subjOfUnit = id => D().subjects.find(s => s.units.some(u => u.id === id));
const qById = id => D().questions.find(q => q.id === id);
const qsOfUnit = id => D().questions.filter(q => q.u === id);
const lessOfUnit = id => D().lessons.filter(l => l.u === id);
function accUnit(id) {
  let n = 0, c = 0; const A = P().ans;
  qsOfUnit(id).forEach(q => { const a = A[q.id]; if (a) { n += a.n; c += a.c; } });
  return n ? c / n : null;
}
function accSubj(s) { let n = 0, c = 0; const A = P().ans; s.units.forEach(u => qsOfUnit(u.id).forEach(q => { const a = A[q.id]; if (a) { n += a.n; c += a.c; } })); return n ? c / n : null; }
const accCls = a => a == null ? "c-none" : a < .4 ? "c-bad" : a < .6 ? "c-warn" : "c-ok";
const accColor = a => a == null ? "var(--line)" : a < .4 ? "var(--bad)" : a < .6 ? "var(--warn)" : "var(--ok)";
const pct = a => a == null ? "—" : Math.round(a * 100) + "%";
const INTERVAL = [0, 1, 3, 7, 14, 30];   // 맞힐수록 다음 복습 간격(일)이 늘어나는 간이 간격반복
function record(qid, ok) {
  const p = P(), a = p.ans[qid] || {n: 0, c: 0, box: 0, due: 0};
  a.n++; if (ok) a.c++; a.ok = ok; a.last = Date.now();
  a.box = ok ? Math.min(a.box + 1, 5) : 0;
  a.due = ok ? Date.now() + INTERVAL[a.box] * DAY : Date.now();
  p.ans[qid] = a; p.days[today()] = (p.days[today()] || 0) + 1; save();
}
const dueList = () => { const A = P().ans, now = Date.now(); return D().questions.filter(q => A[q.id] && A[q.id].due <= now).sort((x, y) => (A[x.id].ok ? 1 : 0) - (A[y.id].ok ? 1 : 0)).map(q => q.id); };
const wrongList = () => { const A = P().ans; return D().questions.filter(q => (A[q.id] && !A[q.id].ok) || P().mark[q.id]).map(q => q.id); };
function streak() { const d = P().days; let n = 0, t = new Date(); if (!d[today()]) t = new Date(Date.now() - DAY); for (;;) { const k = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`; if (d[k]) { n++; t = new Date(t - DAY); } else break; } return n; }
function completion() {
  const qs = D().questions, ls = D().lessons, A = P().ans, L = P().les;
  const done = qs.filter(q => A[q.id]).length + ls.filter(l => L[l.id]).length;
  return {done, total: qs.length + ls.length, ratio: (qs.length + ls.length) ? done / (qs.length + ls.length) : 0};
}
/* 맞춤 세트: 복습할 문제(틀린 것 먼저) + 약한 단원·안 푼 문제 → 10문제 */
function recommend() {
  const A = P().ans, due = dueList().slice(0, 6);
  const us = units().map(u => ({u, a: accUnit(u.id)})).sort((x, y) => (x.a ?? .45) - (y.a ?? .45) || y.u.w - x.u.w);
  const pool = [];
  us.forEach(({u}) => shuffle(qsOfUnit(u.id).filter(q => !A[q.id])).forEach(q => pool.push(q.id)));
  const fresh = pool.filter(id => !due.includes(id)).slice(0, 10 - due.length);
  let ids = due.concat(fresh);
  if (ids.length < 10) ids = ids.concat(shuffle(D().questions.map(q => q.id).filter(id => !ids.includes(id))).slice(0, 10 - ids.length));
  const weak = us.filter(x => x.a != null).slice(0, 3);
  return {ids, due: due.length, fresh: ids.length - due.length, weak};
}
function dday() {
  const d = S.dates[S.exam]; if (!d) return null;
  const t = new Date(d + "T00:00:00"), n = new Date(today() + "T00:00:00");
  return Math.round((t - n) / DAY);
}

/* data-* 로 동작 연결 (화면마다 다시 연결) */

function mockSet() {
  const us = units(), totalW = us.reduce((a, u) => a + u.w, 0), ids = [];
  const N = mockN(); us.forEach(u => { const k = Math.max(1, Math.round(N * u.w / totalW)); shuffle(qsOfUnit(u.id)).slice(0, k).forEach(q => ids.push(q.id)); });
  if (ids.length < N) shuffle(D().questions.map(q => q.id).filter(id => !ids.includes(id))).slice(0, N - ids.length).forEach(id => ids.push(id));
  return shuffle(ids).slice(0, N);
}

window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h) && h !== V.tab) { V.tab = h; V.stack = []; render(); } });
render();
</script>
