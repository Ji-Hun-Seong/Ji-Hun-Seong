name: Manager portfolios (manual)

on:
  workflow_dispatch:
    inputs:
      send:
        description: "1 = 텔레그램 전송, 0 = 미리보기, find = 봇이 속한 채팅 ID 찾기"
        default: "0"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python 13f/portfolios.py ${{ github.event.inputs.send == '1' && '--send' || (github.event.inputs.send == 'find' && '--find-chat' || '') }}
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
