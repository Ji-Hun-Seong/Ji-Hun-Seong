name: Fetch KOSPI foreign ownership (manual)

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest/fetch_foreign.py"
      - ".github/workflows/fetch-foreign.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: |
          mkdir -p backtest/data
          set -o pipefail
          python -u backtest/fetch_foreign.py 2>&1 | tee backtest/data/kospi_foreign_log.txt
      - name: Push to bt-data-fr branch
        if: always()
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          mkdir -p /tmp/d && cp backtest/data/kospi_foreign* /tmp/d/
          git checkout --orphan bt-data-fr
          git rm -rq --cached . && git clean -fdq
          cp /tmp/d/* . && git add kospi_foreign*
          git commit -qm "KOSPI foreign ownership $(date +%F)"
          git push -f origin bt-data-fr
