name: Fetch US events (manual)

on:
  workflow_dispatch:
  push:
    paths:
      - "backtest/fetch_us_events.py"
      - ".github/workflows/fetch-us-events.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas yfinance lxml
      - run: |
          mkdir -p backtest/data
          set -o pipefail
          python -u backtest/fetch_us_events.py 2>&1 | tee backtest/data/usev_log.txt
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY || vars.DART_API_KEY || secrets.DART_KEY || secrets.OPENDART_API_KEY || secrets.DART_API }}
      - name: Push to bt-data-usev branch
        if: always()
        run: |
          git config user.name "backtest-bot"
          git config user.email "backtest-bot@users.noreply.github.com"
          mkdir -p /tmp/d && cp backtest/data/us_earn8k* backtest/data/us_div* backtest/data/us_yfearn* backtest/data/usev_log.txt /tmp/d/
          git checkout --orphan bt-data-usev
          git rm -rq --cached . && git clean -fdq
          cp /tmp/d/* . && git add .
          git commit -qm "US events $(date +%F)"
          git push -f origin bt-data-usev
