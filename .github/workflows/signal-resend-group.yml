name: KOSPI signals → group (resend)

# 마지막 일일 신호를 두 그룹방(기존 그룹 + 아빠 매매일지 바탕 추천 봇)으로 다시 보낸다.
on:
  workflow_dispatch:
  push:
    paths:
      - "signal-bot/resend_request.txt"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Resend to both groups
        env:
          TELEGRAM_TOKEN: ${{ secrets.VALUE_TG_TOKEN }}
          GROUPS: "${{ secrets.VALUE_TG_CHAT_ID }},-5137568055"
        run: |
          for c in $(echo "$GROUPS" | tr ',' ' '); do
            TELEGRAM_CHAT_ID="$c" python signal-bot/resend.py
          done
