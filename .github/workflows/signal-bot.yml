name: KOSPI daily signals

on:
  schedule:
    # GitHub 예약 실행이 최근 9시간가량 늦게 시작되는 일이 반복돼 하루 여러 번 걸어 둔다.
    # 오늘 봉은 한국 18:30 이후에만 처리하고, 이미 처리한 날은 다시 보내지 않으므로 중복 전송 없음.
    - cron: "13 0,2,4,6,8 * * 1-5"   # 한국 09:13~17:13 (지연되면 저녁에 실행됨)
    - cron: "43 9 * * 1-5"           # 한국 18:43
    - cron: "13 11,13 * * 1-5"       # 한국 20:13, 22:13
    - cron: "43 14 * * 1-5"          # 한국 23:43
  workflow_dispatch:
    inputs:
      force:
        description: "1 = 이미 처리한 날이어도 다시 보내기"
        default: "0"
      preview:
        description: "1 = 테스트(지금 장중 가격으로 본인에게만, 기록 안 함)"
        default: "0"
  push:
    paths:
      - "signal-bot/daily_signals.py"
      - ".github/workflows/signal-bot.yml"

permissions:
  contents: write
  actions: write

concurrency:
  # 테스트(preview)는 기록을 건드리지 않으므로 따로 줄 세움 — 본 실행에 밀려 취소되지 않도록
  group: signal-bot-${{ github.event.inputs.preview == '1' && 'preview' || 'main' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Signals → Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.SIGNAL_TG_TOKEN || secrets.VALUE_TG_TOKEN }}
          # 받을 곳: SIGNAL_TG_CHAT_ID(따로 지정 시) → 없으면 본인(TG_CHAT_ID)
          TELEGRAM_CHAT_ID: ${{ secrets.SIGNAL_TG_CHAT_ID || secrets.TG_CHAT_ID }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -o pipefail
          python -u signal-bot/daily_signals.py ${{ github.event.inputs.force == '1' && '--force' || '' }} ${{ github.event.inputs.preview == '1' && '--preview' || '' }} 2>&1 | tee signal-bot/last_run.txt
      # 같은 내용을 가치주 봇 그룹방(아빠와 함께)에도 전송 — 새 메시지를 보낸 날만
      # 같은 내용을 그룹방들에도 전송 — 새 메시지를 보낸 날만
      #   VALUE_TG_CHAT_ID: 기존 가치주 봇 그룹 / -5137568055: "아빠 매매일지 바탕 추천 봇"
      - name: Also send to groups
        if: success() && github.event.inputs.preview != '1'
        env:
          TELEGRAM_TOKEN: ${{ secrets.VALUE_TG_TOKEN }}
          GROUPS: "${{ secrets.VALUE_TG_CHAT_ID }},-5137568055"
        run: |
          grep -q "텔레그램 전송 완료" signal-bot/last_run.txt || exit 0
          for c in $(echo "$GROUPS" | tr ',' ' '); do
            TELEGRAM_CHAT_ID="$c" python signal-bot/resend.py || echo "::warning::그룹 전송 실패"
          done
      # 월 1회 가치주 20선 안전장치: 이번 달 전송 기록이 없으면 가치주 봇을 실행시킨다
      - name: Monthly value picks safety net
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(TZ=Asia/Seoul date +%Y-%m)
          if [ "$(cat value-bot/LAST_SENT 2>/dev/null)" != "$m" ]; then
            echo "이번 달($m) 가치주 20선 전송 기록 없음 → 실행"
            gh workflow run value-bot.yml -f mode=picks || echo "::warning::가치주 봇 실행 요청 실패"
          fi
      # 실패하면 본인 텔레그램으로 바로 알림 (어느 하나도 놓치지 않도록)
      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.VALUE_TG_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ 저녁 일일 신호 봇 실행 실패 ($(TZ=Asia/Seoul date '+%m/%d %H:%M')). 다음 예약 실행 때 자동으로 다시 시도합니다. 확인: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # 모의 포트폴리오 상태를 커밋 → 매일 저장소 활동이 생겨 GitHub이 예약 실행을 멈추지 않음
      - name: Save state
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          for f in signal-bot/state.json signal-bot/last_run.txt signal-bot/last_messages.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "signal-bot: $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
