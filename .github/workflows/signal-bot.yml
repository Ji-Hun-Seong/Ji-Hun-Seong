name: KOSPI daily signals

on:
  schedule:
    # 장 마감 후 공시(대부분 18시 전 접수)까지 반영하려고 저녁에 실행
    - cron: "13 10 * * 1-5"    # 평일 UTC 10:13 = 한국 19:13
    # GitHub 예약 실행은 지연·누락될 수 있어 예비 실행 2회(이미 처리한 날이면 전송하지 않음)
    - cron: "13 12 * * 1-5"    # 한국 21:13
    - cron: "43 14 * * 1-5"    # 한국 23:43
  workflow_dispatch:
    inputs:
      force:
        description: "1 = 이미 처리한 날이어도 다시 보내기"
        default: "0"
  push:
    paths:
      - "signal-bot/daily_signals.py"
      - ".github/workflows/signal-bot.yml"

permissions:
  contents: write

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Signals → Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.SIGNAL_TG_TOKEN || secrets.VALUE_TG_TOKEN }}
          # 받을 곳: SIGNAL_TG_CHAT_ID(따로 지정 시) → 없으면 본인(TG_CHAT_ID)
          TELEGRAM_CHAT_ID: ${{ secrets.SIGNAL_TG_CHAT_ID || secrets.TG_CHAT_ID }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -o pipefail
          python -u signal-bot/daily_signals.py ${{ github.event.inputs.force == '1' && '--force' || '' }} 2>&1 | tee signal-bot/last_run.txt
      # 같은 내용을 가치주 봇 그룹방(아빠와 함께)에도 전송 — 새 메시지를 보낸 날만
      - name: Also send to group
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.VALUE_TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.VALUE_TG_CHAT_ID }}
        run: |
          if grep -q "텔레그램 전송 완료" signal-bot/last_run.txt && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python signal-bot/resend.py || echo "::warning::그룹 전송 실패"
          fi
      # 모의 포트폴리오 상태를 커밋 → 매일 저장소 활동이 생겨 GitHub이 예약 실행을 멈추지 않음
      - name: Save state
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add signal-bot/state.json signal-bot/last_run.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "signal-bot: $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
