name: Surge study US daily

# 미국 장 마감 후(한국 아침) 미국 급등주를 모아 surge-study/data/us 에 쌓고 텔레그램 개인 채팅으로 요약.
on:
  schedule:
    - cron: "23 21 * * 1-5"   # 한국 06:23 (화~토)
    - cron: "53 22 * * 1-5"   # 한국 07:53 (예비)
  workflow_dispatch:
    inputs:
      send:
        description: "1 = 텔레그램 요약 보내기"
        default: "1"

permissions:
  contents: write

concurrency:
  group: surge-us
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pandas numpy
      - name: Collect
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
          TELEGRAM_TOKEN: ${{ secrets.STUDY_TG_TOKEN || secrets.VALUE_TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -u surge-study/us_collect.py ${{ github.event.inputs.send == '0' && '--no-send' || '' }}
      - name: Save
        if: success()
        run: |
          git config user.name "surge-us-bot"
          git config user.email "surge-us-bot@users.noreply.github.com"
          git add surge-study/data/us surge-study/reports/us
          git diff --cached --quiet || git commit -qm "surge-us: $(TZ=America/New_York date +%F) 미국 급등주"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
