name: Intraday buyback alerts   # (장중 공시 알림 · 코스피 전체, 검증된 공시만)

# cron-job.org가 평일 장중 5분마다 이 워크플로를 실행시킨다(workflow_dispatch API).
# GitHub 자체 예약 실행은 몇 시간씩 밀릴 수 있어 외부에서 깨운다.
on:
  workflow_dispatch:
  push:
    paths:
      - "signal-bot/intraday_dart.py"
      - ".github/workflows/intraday-dart.yml"

permissions:
  contents: write

concurrency:
  group: intraday-dart
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - name: Check DART
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.SIGNAL_TG_TOKEN || secrets.VALUE_TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SIGNAL_TG_CHAT_ID || secrets.TG_CHAT_ID }}
          GROUP_CHAT_ID: "${{ secrets.VALUE_TG_CHAT_ID }},-5137568055"   # 기존 그룹, 아빠 매매일지 바탕 추천 봇
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # 코드 변경 시: 최근 거래일 몇 개로 전송 없이 시험하고 결과를 저장
            for r in ; do
              python -u signal-bot/intraday_dart.py --show-doc $r
            done 2>&1 | tee signal-bot/intraday_doc.txt
            for d in 20261015 20261014 20261013 20261008 20261002 20260930; do
              python -u signal-bot/intraday_dart.py --dry-run --any-time --date $d
            done 2>&1 | tee signal-bot/intraday_test.txt
          else
            python -u signal-bot/intraday_dart.py
          fi
      # 실패하면 본인 텔레그램으로 바로 알림 (어느 하나도 놓치지 않도록)
      - name: Notify on failure
        if: failure() && github.event_name != 'push'
        env:
          TOKEN: ${{ secrets.VALUE_TG_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ "$(date +%M)" -lt 5 ] || exit 0   # 같은 장애로 5분마다 알리지 않도록 정각 실행에서만
          curl -s -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ 장중 공시 알림 봇 실행 실패 ($(TZ=Asia/Seoul date '+%m/%d %H:%M')). 다음 예약 실행 때 자동으로 다시 시도합니다. 확인: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Save seen list
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          for f in signal-bot/intraday_seen.json signal-bot/intraday_test.txt signal-bot/intraday_doc.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -qm "intraday: seen $(date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
