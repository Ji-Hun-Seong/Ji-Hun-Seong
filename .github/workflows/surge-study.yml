name: Surge study daily

# 평일 장 마감 후 급등주 데이터를 모아 surge-study/에 쌓고, 텔레그램 개인 채팅으로 요약을 보낸다.
# 예약 실행이 늦게 시작되는 일이 있어 여러 번 걸어 두고, 오늘 이미 모았으면 건너뛴다(휴장일도 자동 건너뜀).
on:
  schedule:
    - cron: "43 9 * * 1-5"    # 한국 18:43
    - cron: "13 11 * * 1-5"   # 한국 20:13 (예비)
    - cron: "13 13 * * 1-5"   # 한국 22:13 (예비)
  workflow_dispatch:
    inputs:
      date:
        description: "수집할 날짜 YYYY-MM-DD (비우면 오늘)"
        default: ""
      send:
        description: "1 = 텔레그램 요약 보내기"
        default: "1"

permissions:
  contents: write

concurrency:
  group: surge-study
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y -qq fonts-nanum >/dev/null && pip install -q requests pandas numpy matplotlib
      - name: Collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          # 받는 곳: 본인 개인 채팅만 (collect.py에서도 그룹 ID 차단)
          TELEGRAM_TOKEN: ${{ secrets.STUDY_TG_TOKEN || secrets.VALUE_TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="--date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.send }}" = "0" ] && ARGS="$ARGS --no-send"
          python -u surge-study/collect.py $ARGS
      - name: Save data
        if: success()
        run: |
          git config user.name "surge-study-bot"
          git config user.email "surge-study-bot@users.noreply.github.com"
          git add surge-study/data surge-study/reports
          git diff --cached --quiet || git commit -qm "surge-study: $(TZ=Asia/Seoul date +%F) 급등주 수집"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Notify on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.STUDY_TG_TOKEN || secrets.VALUE_TG_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=⚠️ 급등주 수집 실패. 확인: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
