name: dash probe
on:
  push:
    branches: [dash-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests yfinance pandas
      - run: python .probe/probe.py
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
