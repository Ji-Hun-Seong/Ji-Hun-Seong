name: Telegram message (manual)

# 특정 대화방에 안내 메시지를 한 번 보낸다(연결 확인용).
on:
  workflow_dispatch:
    inputs:
      chat:
        description: "chat ID"
        required: true
      text:
        description: "보낼 내용"
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas numpy
      - env:
          TELEGRAM_TOKEN: ${{ secrets.VALUE_TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat }}
          TEXT: ${{ github.event.inputs.text }}
        # send()는 토큰의 공백·줄바꿈을 정리하고 실패 시 원인을 알려 준다
        run: python -c "import os,sys; sys.path.insert(0,'signal-bot'); from daily_signals import send; send(os.environ['TEXT'])"
